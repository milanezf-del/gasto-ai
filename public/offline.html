<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gastô — Sem conexão</title>
    <meta name="theme-color" content="#0b0f19" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0f19;
        color: #dfe2f1;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 28px;
        border-radius: 16px;
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #6366f1;
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #908f9e;
        margin: 0 0 20px;
      }
      button {
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #818cf8;
        color: #0b0f19;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">G</div>
      <h1>Você está sem conexão</h1>
      <p>
        O Gastô precisa de internet para sincronizar seus lançamentos, comprovantes e orçamentos com segurança. Verifique sua rede e tente novamente.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
